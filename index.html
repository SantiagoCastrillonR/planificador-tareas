<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-light">

    <header class="bg-white py-3 mb-3 shadow-sm">
        <div class="container">
            <h1 class="h4 text-center mb-1 fw-bold">Planificador de Tareas</h1>
        </div>
    </header>

    <div class="container mb-4">
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <button class="btn btn-outline-success filter-btn active" data-filter="todas">Todas</button>
            <button class="btn btn-outline-success filter-btn" data-filter="pendiente">Por Hacer</button>
            <button class="btn btn-outline-success filter-btn" data-filter="en_progreso">En Progreso</button>
            <button class="btn btn-outline-success filter-btn" data-filter="completado">Terminadas</button>
        </div>
    </div>

    <main class="container">
        <div class="row">

            <!-- Lado izquierdo: Formulario -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 card-title mb-3 fw-bold">Nueva Tarea</h2>

                        <form id="formulario-tareas">
                            <div class="mb-3">
                                <label for="nombreTarea" class="form-label text-secondary">Nombre de la Tarea</label>
                                <input type="text" class="form-control border-secondary-subtle" id="nombreTarea"
                                    placeholder="Ej. Terminar Sprint 1">
                            </div>

                            <div class="mb-3">
                                <label for="descripcionTarea" class="form-label text-secondary">Descripción</label>
                                <textarea class="form-control border-secondary-subtle" id="descripcionTarea" rows="3"
                                    placeholder="Añade detalles aquí..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="categoriaTarea" class="form-label text-secondary">Categoría</label>
                                <select class="form-select border-secondary-subtle" id="categoriaTarea">
                                    <option value="" selected disabled>Selecciona una categoría...</option>
                                    <option value="Trabajo">Trabajo</option>
                                    <option value="Estudio">Estudio</option>
                                    <option value="Personal">Personal</option>
                                    <option value="Hogar">Hogar</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>

                            <div class="mb-3 d-none" id="contenedorOtraCategoria">
                                <label for="otraCategoria" class="form-label text-secondary">Especifica la categoría</label>
                                <input type="text" class="form-control border-secondary-subtle" id="otraCategoria" placeholder="Nombre de la categoría">
                            </div>


                            <div class="mb-3">
                                <label for="fechaInicioTarea" class="form-label text-secondary">Fecha de inicio</label>
                                <input type="date" class="form-control border-secondary-subtle" id="fechaInicioTarea">
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="fechaLimiteTarea" class="form-label text-secondary mb-0">Fecha límite</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="sinFechaLimite">
                                        <label class="form-check-label small text-muted" for="sinFechaLimite">
                                            Sin fecha límite
                                        </label>
                                    </div>
                                </div>
                                <input type="date" class="form-control border-secondary-subtle" id="fechaLimiteTarea">
                            </div>

                            <div class="mb-3">
                                <label for="estadoTarea" class="form-label text-secondary">Estado</label>
                                <select class="form-select border-secondary-subtle" id="estadoTarea">
                                    <option value="" selected disabled>Selecciona un estado...</option>
                                    <option value="pendiente">Pendiente</option>
                                    <option value="en_progreso">En Progreso</option>
                                    <option value="completado">Completado</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-bold mt-2">
                                Agregar
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lado derecho: Lista de tareas -->
            <div class="col-md-8">
                <div class="card shadow-sm bg-transparent border-0">
                    <div class="card-body p-2">
                        <h2 class="h5 mb-3 fw-bold">Mis Tareas</h2>
                        <div id="lista-tareas" class="row g-3">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success-subtle border-0">
                    <h5 class="modal-title fw-bold text-success">Actualizar Tarea</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="form-editar-tarea">
                        <input type="hidden" id="editTaskId">
                        
                        <div class="mb-3">
                            <label class="form-label text-secondary">Nombre de la Tarea</label>
                            <input type="text" class="form-control" id="editNombreTarea" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary">Descripción</label>
                            <textarea class="form-control" id="editDescripcionTarea" rows="3" required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-secondary">Categoría</label>
                            <select class="form-select" id="editCategoriaTarea">
                                <option value="Trabajo">Trabajo</option>
                                <option value="Estudio">Estudio</option>
                                <option value="Personal">Personal</option>
                                <option value="Hogar">Hogar</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="mb-3 d-none" id="editContenedorOtraCategoria">
                            <label class="form-label text-secondary">Especifica la categoría</label>
                            <input type="text" class="form-control" id="editOtraCategoria">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary">Fecha de inicio</label>
                            <input type="date" class="form-control" id="editFechaInicioTarea">
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label text-secondary mb-0">Fecha límite</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="editSinFechaLimite">
                                    <label class="form-check-label small text-muted" for="editSinFechaLimite">
                                        Sin fecha límite
                                    </label>
                                </div>
                            </div>
                            <input type="date" class="form-control" id="editFechaLimiteTarea">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary">Estado</label>
                            <select class="form-select" id="editEstadoTarea" required>
                                <option value="pendiente">Pendiente</option>
                                <option value="en_progreso">En Progreso</option>
                                <option value="completado">Completado</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success fw-bold">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="./js/taskManager.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
