<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="bg-light">

    <header class="bg-white py-3 mb-4 shadow-sm">
        <div class="container">
            <h1 class="h4 text-center mb-1 fw-bold">Planificador de Tareas</h1>
        </div>
    </header>

    <main class="container">
        <div class="row">

            <!-- lado izquierdo -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 card-title mb-3 fw-bold">Nueva Tarea</h2>

                        <form id="formulario-tareas">

                            <div class="mb-3">
                                <label for="nombreTarea" class="form-label text-secondary">Nombre de la Tarea</label>
                                <input type="text" class="form-control border-secondary-subtle" id="nombreTarea"
                                    placeholder="Ej. Terminar Sprint 1" required>
                            </div>

                            <div class="mb-3">
                                <label for="descripcionTarea" class="form-label text-secondary">Descripción</label>
                                <textarea class="form-control border-secondary-subtle" id="descripcionTarea" rows="3"
                                    placeholder="Añade detalles aquí..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-bold mt-2">
                                Agregar
                            </button>

                        </form>
                    </div>
                </div>
            </div>

            <!-- lado derecho -->
            <div class="col-md-8">
                <div class="card shadow-sm bg-transparent border-0">
                    <div class="card-body p-2">
                        <h2 class="h5 mb-3 fw-bold">Mis Tareas</h2>

                        <div id="lista-tareas">

                            <div class="card mb-2 shadow-sm border-secondary-subtle">
                                <div class="card-body d-flex justify-content-between align-items-center">
                                    <div class="d-flex align-items-center">

                                        <!-- Checkbox -->
                                        <input class="form-check-input me-3 mt-0 border-secondary " type="checkbox"
                                            value="" id="tarea1" style="width: 1.5rem; height: 1.5rem;">
                                        <label class="form-check-label fw-semibold" for="tarea1">
                                            Ejemplo 1
                                        </label>
                                    </div>

                                    <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
